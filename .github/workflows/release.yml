name: Build and release Windows ZIP
on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test filtering and cache behavior
        shell: pwsh
        run: dotnet run --project tests/SteamAchievementUnlocker.Tests.csproj -c Release
      - name: Build self-contained Windows and clean source archives
        shell: pwsh
        run: ./scripts/Publish-Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: SteamAchievementUnlocker-release
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SteamAchievementUnlocker-release
          path: artifacts
      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$env:RELEASE_TAG" artifacts/SteamAchievementUnlocker-win-x64.zip artifacts/SteamAchievementUnlocker-source.zip artifacts/SHA256SUMS.txt --verify-tag --generate-notes --title "Steam Achievement Unlocker $env:RELEASE_TAG"
